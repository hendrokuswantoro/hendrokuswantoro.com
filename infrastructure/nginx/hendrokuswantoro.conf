# Nginx untuk hendrokuswantoro.com di VPS. Bab 12, reverse proxy.
#
# Berkas ini menyajikan dua hal yang berbeda sifatnya dari satu alamat:
#
#   /            berkas statis hasil `sh tools/bangun_situs.sh`, dibaca dari
#                disk, tidak pernah menyentuh Python
#   /api/        FastAPI lewat soket Unix, bukan porta TCP
#   /admin       halaman menulis, dari FastAPI yang sama
#
# Yang statis tidak boleh lewat Python. Situs empat halaman yang tiap
# permintaannya membangunkan proses aplikasi adalah situs yang bisa
# dijatuhkan satu orang dengan satu perulangan curl.
#
# Soket Unix, bukan 127.0.0.1:8000. Porta TCP pada localhost tetap bisa
# dihubungi proses mana pun di mesin itu; soket dengan pemilik dan izin
# berkas hanya bisa dihubungi yang memang boleh.
#
# Memeriksa berkas ini tanpa VPS:
#     sh infrastructure/periksa_nginx.sh
# Ia menjalankan `nginx -t` di dalam kontainer nginx resmi, jadi salah ketik
# ketahuan di sini, bukan saat `systemctl reload nginx` di server sungguhan
# menolak menyala dan situsnya mati.

# --- pembatas laju -----------------------------------------------------------
# Ditegakkan di tepi, sebelum permintaan sampai ke Python. Pembatas laju yang
# baru bekerja sesudah aplikasinya bangun tidak melindungi aplikasinya.
#
# Dua zona, sebab dua hal ini sangat berbeda ongkosnya: membaca halaman murah,
# mencoba masuk mahal dan layak dicurigai.
limit_req_zone $binary_remote_addr zone=umum:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=masuk:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=sambungan:10m;

# Nginx tidak punya map bawaan untuk ini; tanpa map, header Connection untuk
# WebSocket akan salah pada permintaan biasa.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream hk_api {
    server unix:/run/hk-api/api.sock;
    keepalive 16;
}

# --- HTTP, hanya untuk dialihkan dan untuk ACME ------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name hendrokuswantoro.com www.hendrokuswantoro.com;

    # Satu satunya yang boleh dijawab lewat HTTP. certbot menaruh berkas
    # tantangannya di sini.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://www.hendrokuswantoro.com$request_uri;
    }
}

# --- apex, dialihkan ke www --------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hendrokuswantoro.com;

    ssl_certificate     /etc/letsencrypt/live/hendrokuswantoro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hendrokuswantoro.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 308 https://www.hendrokuswantoro.com$request_uri;
}

# --- situsnya ----------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.hendrokuswantoro.com;

    root /srv/hendrokuswantoro/situs;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/hendrokuswantoro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hendrokuswantoro.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # OCSP stapling: peramban tidak perlu bertanya sendiri ke penerbit
    # sertifikat, yang selain lambat juga memberi tahu penerbit siapa yang
    # sedang membuka situs ini.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 9.9.9.9 valid=300s;
    resolver_timeout 5s;

    # Versi nginx tidak perlu diumumkan ke setiap pengunjung.
    server_tokens off;

    client_max_body_size 2m;
    limit_conn sambungan 24;

    # --- header keamanan -----------------------------------------------------
    # Sama persis dengan _headers yang dipakai Cloudflare. Dijaga
    # tests/test_infrastruktur.py: kalau salah satunya bergeser, ujinya gagal,
    # sebab situs yang aturannya berbeda tergantung siapa yang menyajikannya
    # adalah dua situs yang berbeda.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https://tiles.openfreemap.org https://api.mapbox.com https://server.arcgisonline.com https://s3.amazonaws.com; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' blob: 'sha256-VUnTnFlu5ng6WnqmcjBDYVMXzjgyRSeLJtiwFpIU9Pw='; worker-src 'self' blob:; child-src blob:; connect-src 'self' https://tiles.openfreemap.org https://api.mapbox.com https://events.mapbox.com https://server.arcgisonline.com https://s3.amazonaws.com; object-src 'none'; upgrade-insecure-requests" always;

    # --- kompresi ------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml application/rss+xml application/manifest+json;
    # Gambar webp dan png sudah padat. Memadatkannya lagi hanya membakar CPU.

    # --- alamat tanpa .html --------------------------------------------------
    # Situsnya menyebut /about, bukan /about.html, dan alamat lama yang sudah
    # beredar tetap harus hidup. Urutannya penting: coba apa adanya, lalu
    # dengan .html, lalu sebagai folder, baru menyerah.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Alamat lama dengan .html dialihkan permanen ke yang tanpa, supaya hanya
    # ada satu alamat kanonis per halaman dan mesin pencari tidak menghitung
    # keduanya sebagai dua halaman yang isinya sama.
    location ~ ^(/.+)\.html$ {
        return 308 $1$is_args$args;
    }

    # --- satu aset yang TIDAK boleh disimpan selamanya ------------------------
    # konfigurasi.js ditulis saat membangun dari variabel MAPBOX_TOKEN, jadi
    # alamatnya tidak bisa ikut bercap sidik isinya: sidik itu baru diketahui
    # sesudah app.js yang menyebutnya selesai ditulis. Kalau ia ikut immutable,
    # pembaca yang kebetulan berkunjung saat tokennya sedang kosong akan
    # memegang berkas kosong itu setahun penuh, dan petanya mati tanpa satu pun
    # galat. Berkasnya 298 bita; satu permintaan bersyarat per kunjungan murah.
    #
    # Harus berada di ATAS location /assets/ supaya nginx memilih yang ini:
    # location dengan awalan yang lebih panjang menang atas yang lebih pendek,
    # dan "= " membuatnya cocok persis.
    location = /assets/js/konfigurasi.js {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https://tiles.openfreemap.org https://api.mapbox.com https://server.arcgisonline.com https://s3.amazonaws.com; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' blob: 'sha256-VUnTnFlu5ng6WnqmcjBDYVMXzjgyRSeLJtiwFpIU9Pw='; worker-src 'self' blob:; child-src blob:; connect-src 'self' https://tiles.openfreemap.org https://api.mapbox.com https://events.mapbox.com https://server.arcgisonline.com https://s3.amazonaws.com; object-src 'none'; upgrade-insecure-requests" always;
        access_log off;
        try_files $uri =404;
    }

    # --- aset bercap versi ---------------------------------------------------
    # Berkasnya dipanggil dengan ?v=<sidik isinya>, atau berada di dalam folder
    # bernama versi pustakanya, jadi berkas yang berubah punya alamat yang
    # berubah dan yang lama boleh disimpan selamanya. tools/versi_aset.py yang
    # menjaminnya, dan CI menolak nomor yang tertinggal dari isinya.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # Keenam header di bawah ini diulang, dan itu bukan salinan yang lupa
        # dihapus. Satu add_header di dalam location MENGHAPUS seluruh
        # add_header dari blok server, termasuk yang tidak disebut di sini.
        # Jebakan itu sudah dijelaskan di blok /api/ di bawah, lalu tetap
        # memakan blok ini: sejak add_header Cache-Control dipasang, setiap
        # berkas di /assets/ dikirim tanpa nosniff, tanpa HSTS, dan tanpa CSP.
        #
        # Yang paling berarti nosniff. Tanpanya peramban boleh menebak jenis
        # berkas dari isinya, dan berkas yang ditebak salah bisa dieksekusi
        # sebagai skrip. Di sini letak seluruh JavaScript, SVG, dan font situs
        # ini.
        #
        # Cloudflare tidak punya jebakan ini: _headers menumpuk aturan /* dan
        # /assets/*, tidak menggantinya. Jadi selama baris ini tidak ada,
        # nginx dan Cloudflare menyajikan dua situs dengan aturan berbeda,
        # dan yang diuji hanya salah satunya.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https://tiles.openfreemap.org https://api.mapbox.com https://server.arcgisonline.com https://s3.amazonaws.com; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' blob: 'sha256-VUnTnFlu5ng6WnqmcjBDYVMXzjgyRSeLJtiwFpIU9Pw='; worker-src 'self' blob:; child-src blob:; connect-src 'self' https://tiles.openfreemap.org https://api.mapbox.com https://events.mapbox.com https://server.arcgisonline.com https://s3.amazonaws.com; object-src 'none'; upgrade-insecure-requests" always;

        access_log off;
        try_files $uri =404;
    }

    # HTML tidak pernah disimpan lama. Isi yang basah satu hari karena cache
    # adalah isi yang diterbitkan kemarin.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # --- API -----------------------------------------------------------------
    location /api/ {
        limit_req zone=umum burst=60 nodelay;

        proxy_pass http://hk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Header keamanan datang dari blok server di atas, dan add_header di
        # dalam location akan MENGHAPUS seluruh add_header induknya. Jadi
        # tidak ada add_header di sini, dengan sengaja. Ini jebakan nginx yang
        # paling sering memakan korban.
    }

    # Jalur masuk dibatasi jauh lebih ketat. Sepuluh per menit cukup untuk
    # orang yang salah ketik sandinya, jauh dari cukup untuk menebak.
    location /api/v1/auth/ {
        limit_req zone=masuk burst=5 nodelay;

        proxy_pass http://hk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /admin {
        limit_req zone=umum burst=10 nodelay;
        proxy_pass http://hk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # --- yang tidak boleh terbaca --------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt  { access_log off; }
    location = /favicon.ico { access_log off; log_not_found off; }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
