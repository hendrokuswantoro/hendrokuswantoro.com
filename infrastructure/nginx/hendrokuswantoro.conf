limit_req_zone $binary_remote_addr zone=umum:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=masuk:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=sambungan:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $remote_addr $admin_boleh {
    default 0;

}

upstream hk_api {
    server unix:/run/hk-api/api.sock;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name hendrokuswantoro.com www.hendrokuswantoro.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://www.hendrokuswantoro.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hendrokuswantoro.com;

    ssl_certificate     /etc/letsencrypt/live/hendrokuswantoro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hendrokuswantoro.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 308 https://www.hendrokuswantoro.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.hendrokuswantoro.com;

    root /srv/hendrokuswantoro/situs;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/hendrokuswantoro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hendrokuswantoro.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 9.9.9.9 valid=300s;
    resolver_timeout 5s;

    server_tokens off;

    client_max_body_size 2m;
    limit_conn sambungan 24;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https://tiles.openfreemap.org https://api.mapbox.com https://server.arcgisonline.com https://s3.amazonaws.com; style-src 'self'; font-src 'self'; script-src 'self' blob: 'sha256-VUnTnFlu5ng6WnqmcjBDYVMXzjgyRSeLJtiwFpIU9Pw='; worker-src 'self' blob:; child-src blob:; connect-src 'self' https://tiles.openfreemap.org https://api.mapbox.com https://events.mapbox.com https://server.arcgisonline.com https://s3.amazonaws.com; object-src 'none'; upgrade-insecure-requests" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml application/rss+xml application/manifest+json;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~ ^(/.+)\.html$ {
        return 308 $1$is_args$args;
    }

    location = /assets/js/konfigurasi.js {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https://tiles.openfreemap.org https://api.mapbox.com https://server.arcgisonline.com https://s3.amazonaws.com; style-src 'self'; font-src 'self'; script-src 'self' blob: 'sha256-VUnTnFlu5ng6WnqmcjBDYVMXzjgyRSeLJtiwFpIU9Pw='; worker-src 'self' blob:; child-src blob:; connect-src 'self' https://tiles.openfreemap.org https://api.mapbox.com https://events.mapbox.com https://server.arcgisonline.com https://s3.amazonaws.com; object-src 'none'; upgrade-insecure-requests" always;
        access_log off;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https://tiles.openfreemap.org https://api.mapbox.com https://server.arcgisonline.com https://s3.amazonaws.com; style-src 'self'; font-src 'self'; script-src 'self' blob: 'sha256-VUnTnFlu5ng6WnqmcjBDYVMXzjgyRSeLJtiwFpIU9Pw='; worker-src 'self' blob:; child-src blob:; connect-src 'self' https://tiles.openfreemap.org https://api.mapbox.com https://events.mapbox.com https://server.arcgisonline.com https://s3.amazonaws.com; object-src 'none'; upgrade-insecure-requests" always;

        access_log off;
        try_files $uri =404;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location /api/ {
        limit_req zone=umum burst=60 nodelay;

        proxy_pass http://hk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

    }

    location = /api/v1/admin/berkas {
        limit_req zone=umum burst=10 nodelay;

        client_max_body_size 96m;
        client_body_timeout 300s;

        proxy_pass http://hk_api;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /unggahan/ {
        limit_req zone=umum burst=60 nodelay;

        proxy_pass http://hk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        access_log off;
    }

    location /api/v1/auth/ {
        limit_req zone=masuk burst=5 nodelay;

        proxy_pass http://hk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location ^~ /admin {
        limit_req zone=umum burst=10 nodelay;

        # if ($admin_boleh = 0) { return 404; }

        add_header Permissions-Policy "geolocation=(), camera=(self), microphone=(), payment=(), interest-cohort=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; child-src blob:; connect-src 'self'; object-src 'none'; upgrade-insecure-requests" always;

        proxy_pass http://hk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt  { access_log off; }
    location = /favicon.ico { access_log off; log_not_found off; }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
