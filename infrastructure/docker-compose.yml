# Basis data dan cache untuk pengembangan lokal.
#
#   cd infrastructure && docker compose up -d
#
# Hanya dua layanan di sini. Backend dan frontend belum ikut sampai Fase 2,
# sebab menjalankan kontainer untuk kode yang belum ada tidak menghasilkan
# apa pun selain kontainer yang mati.
#
# Tidak ada kata sandi bawaan di berkas ini. Nilainya datang dari .env di
# akar repositori, yang tidak pernah ikut git.

name: hendrokuswantoro

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: hk_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER belum diisi di .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum diisi di .env}
      POSTGRES_DB: ${POSTGRES_DB:-hendrokuswantoro}
      # Locale Indonesia untuk pengurutan teks yang benar
      LANG: C.UTF-8
    ports:
      # hanya ke localhost. Basis data tidak pernah menghadap internet.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - data_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # bab 15.14: kontainer tidak berjalan sebagai root bila bisa dihindari
    security_opt:
      - no-new-privileges:true

  cache:
    image: redis:7-alpine
    container_name: hk_cache
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - data_cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true

volumes:
  data_db:
  data_cache:
