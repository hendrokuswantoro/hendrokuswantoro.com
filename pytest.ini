[pytest]
testpaths = tests
# -rs: alasan tiap uji yang dilewati selalu dicetak. Uji yang dilewati
# diam diam adalah uji yang berhenti menjaga apa pun tanpa ada yang tahu.
addopts = -q -rs --strict-markers -m "not peramban"

markers =
    peramban: uji yang menjalankan Chromium sungguhan lewat Playwright

# Kenapa uji peramban dikeluarkan dari jalankan bawaan, dan bukan sekadar
# karena lambat:
#
# Di Windows, psycopg menolak ProactorEventLoop sedangkan Playwright
# menuntutnya untuk menjalankan subproses. Uji basis data menyetel
# WindowsSelectorEventLoopPolicy, dan sesudah itu Playwright gagal dengan
# NotImplementedError di proses yang sama. Keduanya tidak bisa hidup
# berdampingan dalam satu proses pytest di Windows.
#
# Karena itu dipisah, bukan dihilangkan:
#
#     python -m pytest                  seluruhnya kecuali peramban
#     python -m pytest -m peramban      uji Chromium
#     sh tools/verifikasi.sh            keduanya, berurutan
#
# CI menjalankan keduanya di pekerjaan yang berbeda, jadi di Linux pun
# pemisahannya tetap berlaku dan tidak ada yang terlewat diam diam.
