# Git Push -> Lint -> Type Check -> Test -> Security Scan -> Build
#
# Deploy is not here on purpose. Cloudflare builds and publishes on its own
# when main moves, so putting a second deploy in this file would give the
# site two masters. What this pipeline does is refuse to let a push reach
# that point silently broken.
#
# Health Check lives in kesehatan.yml, because it has to run against the
# site after Cloudflare has finished, not before.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts parse
        run: |
          for berkas in tools/*.sh; do
            sh -n "$berkas"
            echo "ok $berkas"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python compiles
        run: python -m compileall -q tools tests

      - name: No tab indentation in the stylesheet
        run: |
          if grep -Pn '^\t' assets/css/style.css; then
            echo "the stylesheet is indented with spaces everywhere else"
            exit 1
          fi

      - name: The committed blog pages match what the content generates
        run: |
          python tools/bangun_tulisan.py --periksa

      - name: JavaScript has no syntax error
        run: |
          for berkas in assets/js/app.js assets/js/peta.js; do
            node --check "$berkas"
            echo "ok $berkas"
          done

      - name: Infrastructure shell scripts parse
        run: |
          for berkas in infrastructure/*.sh; do
            sh -n "$berkas"
            echo "ok $berkas"
          done

      # Angka rasio kontras yang ditulis di kepala style.css hanya benar
      # sampai ada yang menggeser satu warna tanpa menghitung ulang.
      - name: Every text colour still passes WCAG AA
        run: python tools/kontras.py

      # Skrip tema sebaris diizinkan CSP lewat hash. Berubah satu byte tanpa
      # hashnya ikut diperbarui berarti temanya berhenti bekerja di peramban
      # tanpa satu pun pesan di halaman.
      - name: The inline script hash matches _headers
        run: python tools/hash_skrip.py

      # Dua salinan sistem desain adalah dua tempat yang harus diubah tiap
      # kali satu warna bergeser, dan yang kedua selalu tertinggal.
      - name: The Next.js port's stylesheet is not behind
        run: python tools/gaya_next.py --periksa

      # Diperiksa nginx sungguhan di dalam kontainer. Salah ketik satu titik
      # koma di sini jauh lebih murah daripada `systemctl reload nginx` yang
      # menolak menyala saat situsnya sudah hidup.
      - name: The nginx config is valid
        run: sh infrastructure/periksa_nginx.sh

      # Delapan berkas woff2 plus sha256-nya, diperiksa luring.
      - name: The vendored font matches its record
        run: python tools/ambil_font.py --periksa

      # Alur kerjanya sendiri tidak pernah diperiksa sebelum dijalankan.
      #
      # Yang dicari bukan hanya sintaks. kesehatan.yml pernah memuat daftar
      # jalur yang dipisah dengan "\n" harfiah, bukan baris baru, sehingga
      # shell membacanya sebagai kata bernilai "n" dan pemeriksaannya meminta
      # alamat yang memang tidak ada. Sintaksnya sah sempurna, jadi bash -n
      # meloloskannya, dan akibatnya health check gagal tiap malam sambil
      # membuka isu yang menyatakan situsnya mati. Situsnya sehat.
      - name: The workflows themselves parse
        run: |
          pip install PyYAML==6.0.3
          python tools/periksa_alur.py

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm ci, bukan npm install: lockfile-nya sudah ada sejak Node
      # terpasang di mesin pengembangan, dan ci memasang persis versi yang
      # tertulis di sana, bukan versi terbaru yang kebetulan cocok.
      - run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      # Type check membuktikan tipenya benar, bukan bahwa aplikasinya bisa
      # dibangun.
      - name: Build
        env:
          NEXT_PUBLIC_MAPBOX_TOKEN: ""
        run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tests/requirements.txt
      - run: python -m pytest tests -q

  keamanan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No secret may enter the repository
        run: |
          pola='pk\.eyJ[A-Za-z0-9]|sk\.eyJ[A-Za-z0-9]|BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}'
          if git grep -nIE "$pola" -- . ':!tests/test_peta.py' ':!.github/workflows/ci.yml'; then
            echo "a credential is about to be published"
            exit 1
          fi
          echo "clean"

      - name: The token file stays out of git
        run: |
          if git ls-files --error-unmatch assets/js/konfigurasi.js 2>/dev/null; then
            echo "konfigurasi.js is tracked, and it carries the Mapbox token"
            exit 1
          fi
          grep -q 'assets/js/konfigurasi.js' .gitignore
          echo "ignored, as it should be"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The report is printed in full and read, but it does not fail the
      # pipeline. Every package it covers belongs to next/, a port that has
      # never been built and never been published: not one npm package
      # reaches a visitor. The moment that port is deployed, drop the
      # "|| true" and this becomes a blocking check again.
      #
      # The dependency that does reach a visitor is MapLibre, vendored under
      # assets/vendor/ where npm cannot see it. It carries an unfixed
      # critical advisory, and the reason it is still here is written down
      # in docs/keamanan.md rather than hidden behind a green check.
      - name: Dependency audit, reported not enforced
        working-directory: next
        run: |
          npm install --package-lock-only --no-audit --no-fund
          npm audit || true
          echo
          echo "Advisories above belong to next/, which is not deployed."
          echo "See docs/keamanan.md for the one that is."

      # Ini MEMBLOKIR, tidak seperti npm audit di atas. Bedanya nyata:
      # paket Python di bawah ini benar benar berjalan di server yang
      # menghadap internet dan memegang basis data, sedangkan yang di next/
      # belum pernah diterbitkan sama sekali.
      #
      # Penyisiran 13 September 2026 menemukan 24 temuan di dua paket, dan
      # keduanya sudah dinaikkan. Langkah ini yang menjaga supaya temuan
      # berikutnya ketahuan pada hari ia diumumkan, bukan berbulan bulan
      # kemudian. Kalau suatu saat ada temuan yang memang tidak bisa
      # ditambal, tulis alasannya di docs/audit-keamanan.md lalu kecualikan
      # ID-nya di sini dengan tersurat, bukan dengan "|| true".
      - name: Python dependency audit, enforced
        run: |
          pip install -q pip-audit
          pip-audit -r backend/requirements.txt --strict

      # maplibre-gl.js, tanpa m, sudah tidak ada sejak versi 6: MapLibre 6
      # terbit sebagai ES module saja. Langkah ini masih menunjuk ke berkas
      # lama, jadi ia GAGAL di tiap push sejak 12 September 2026, dan yang
      # gagal bukan hal yang dijaganya.
      - name: The vendored library has not moved without the record moving
        run: |
          versi=$(cat assets/vendor/maplibre/VERSI)
          test -f assets/vendor/maplibre/maplibre-gl.mjs
          grep -q "/v$versi/" assets/vendor/maplibre/maplibre-gl.mjs
          grep -q "GHSA-jrc7-96c5-q579" docs/keamanan.md
          echo "vendored MapLibre $versi, advisory recorded"

  basisdata:
    name: DB and API Verification
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: hendro
          POSTGRES_PASSWORD: uji
          POSTGRES_DB: hendrokuswantoro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hendro -d hendrokuswantoro"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DSN: postgresql://hendro:uji@127.0.0.1:5432/hendrokuswantoro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt -r tests/requirements.txt

      - name: Migrations apply to an empty database
        run: python backend/db/migrasi.py

      - name: Migrations are idempotent
        run: |
          python backend/db/migrasi.py | tee ulang.txt
          grep -q "0 migrasi diterapkan" ulang.txt

      - name: Seed from content/
        run: python backend/db/muat_awal.py

      - name: Database tests
        run: python -m pytest tests/test_basis_data.py -q

      - name: API tests
        run: |
          python -m pytest tests/test_api.py -q --tb=short | tee hasil-api.txt
          kode=${PIPESTATUS[0]}
          {
            echo "### Uji API"
            echo
            echo '```'
            tail -40 hasil-api.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$kode"
        shell: bash

      - name: Auth tests
        env:
          JWT_SECRET: rahasia-uji-yang-panjangnya-lebih-dari-tiga-puluh-dua
          COOKIE_AMAN: "false"
        run: |
          python - <<'PY'
          import os, sys, pathlib
          sys.path.insert(0, str(pathlib.Path.cwd()))
          import psycopg
          from backend.core.keamanan import hash_sandi
          with psycopg.connect(os.environ["DSN"]) as s, s.cursor() as k:
              k.execute("UPDATE users SET sandi_hash=%s WHERE lower(email)=lower(%s)",
                        (hash_sandi("sandi-uji-lokal-panjang"),
                         "kuswantoro.hendro01@gmail.com"))
              s.commit()
          PY
          python -m pytest tests/test_auth.py -q

      - name: Passkey tests
        env:
          JWT_SECRET: rahasia-uji-yang-panjangnya-lebih-dari-tiga-puluh-dua
          COOKIE_AMAN: "false"
        run: python -m pytest tests/test_passkey.py -q

      - name: Backup and restore, without encryption
        run: |
          python backend/db/cadangan.py buat
          python backend/db/cadangan.py uji-pulih

      # Langkah yang sama, kali ini terenkripsi. Cadangan yang bisa dibuat
      # tetapi tidak bisa dibuka lagi adalah cadangan yang tidak ada, dan itu
      # baru ketahuan pada hari ia dibutuhkan.
      - name: Backup, encrypted, and restored again
        run: |
          eval "$(python backend/db/enkripsi.py kunci | head -1 | sed 's/^/export /')"
          python backend/db/cadangan.py buat | tee dibuat.txt
          grep -q 'terenkripsi' dibuat.txt
          python backend/db/cadangan.py daftar
          python backend/db/cadangan.py uji-pulih

      - name: The shipping script refuses anything unencrypted
        run: |
          mkdir -p /tmp/cadangan-palsu
          printf 'ini bukan berkas terenkripsi' > /tmp/cadangan-palsu/hk-2026-01-01-0000.sql.gz.enc
          if CADANGAN_FOLDER=/tmp/cadangan-palsu CADANGAN_TUJUAN=palsu:bucket              sh infrastructure/kirim.sh --coba; then
            echo "pengirim menerima berkas yang tidak terenkripsi"
            exit 1
          fi
          echo "ditolak, seperti seharusnya"

      - name: Admin write tests
        env:
          JWT_SECRET: rahasia-uji-yang-panjangnya-lebih-dari-tiga-puluh-dua
          COOKIE_AMAN: "false"
        run: python -m pytest tests/test_admin.py -q

  peramban:
    name: Browser and Performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tests/requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium chromium-headless-shell

      # Token Mapbox dibutuhkan: tanpa itu peta jatuh ke OpenFreeMap dan yang
      # diuji bukan lagi peta yang terbit.
      #
      # Kalau rahasianya belum dipasang, atau kalau tokennya dibatasi per URL
      # dan asal runner tidak ada di daftarnya, empat uji peta dilewati dengan
      # alasan yang menyebut persis apa yang harus dikerjakan. pytest.ini
      # memakai -rs, jadi alasan itu selalu tercetak di log dan tidak bisa
      # lolos diam diam. Sampai 13 September 2026 komentar di tempat ini
      # mengaku begitu padahal ujinya justru GAGAL; sekarang benar.
      - name: Write the map token
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: sh tools/konfigurasi.sh

      # -m peramban wajib ada, dan ketiadaannya yang menggagalkan langkah ini
      # berhari hari.
      #
      # pytest.ini memasang addopts `-m "not peramban"` supaya putaran biasa
      # tidak menyalakan Chromium. Seluruh test_peramban.py bertanda peramban,
      # jadi tanpa -m peramban di sini pytest tidak mengumpulkan satu uji pun
      # dan keluar dengan kode 5. Kode 5 berarti "tidak ada uji", bukan "ada
      # uji yang gagal", dan tampak di halaman Actions hanya sebagai "Process
      # completed with exit code 5".
      #
      # Selama itu tidak ada satu pun uji peramban yang benar benar berjalan
      # di CI, sementara komentar di langkah di atas menjelaskan panjang lebar
      # bagaimana empat uji peta akan dilewati dengan alasan yang jelas. Uji
      # yang tidak pernah dijalankan tidak menjaga apa pun, dan yang paling
      # buruk, kegagalannya terbaca seolah ada uji yang jatuh.
      #
      # tests/test_infrastruktur.py sekarang menolak langkah peramban di
      # berkas ini yang tidak menyebut -m peramban.
      #
      # Hasilnya ikut ditulis ke ringkasan run, bukan hanya ke log. Log runner
      # menuntut hak admin repositori untuk dibaca lewat API, jadi kegagalan di
      # sini pernah tidak bisa ditelusuri sama sekali dari luar.
      - name: Browser tests
        run: |
          python -m pytest tests/test_peramban.py -q -m peramban --tb=short | tee hasil-peramban.txt
          kode=${PIPESTATUS[0]}
          {
            echo "### Uji peramban"
            echo
            echo '```'
            tail -40 hasil-peramban.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Anotasi, bukan hanya ringkasan. Log runner menuntut hak
          # admin repositori untuk dibaca lewat API, dan ringkasan run
          # pun tidak terbaca dari sana. Anotasi terbaca. Tanpa ini,
          # satu satunya yang terlihat dari luar adalah "Process
          # completed with exit code 5", dan menemukan sebabnya
          # menuntut menebak. Sudah terjadi.
          if [ "$kode" != "0" ]; then
            ringkas=$(tail -25 hasil-peramban.txt | sed "s/%/%%/g" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Uji peramban gagal, kode $kode::$ringkas"
          fi
          exit "$kode"
        shell: bash

      - name: Performance budgets
        run: |
          python -m pytest tests/test_performa.py -q -s -m peramban --tb=short | tee hasil-performa.txt
          kode=${PIPESTATUS[0]}
          {
            echo "### Anggaran performa"
            echo
            echo '```'
            tail -40 hasil-performa.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Anotasi, bukan hanya ringkasan. Log runner menuntut hak
          # admin repositori untuk dibaca lewat API, dan ringkasan run
          # pun tidak terbaca dari sana. Anotasi terbaca. Tanpa ini,
          # satu satunya yang terlihat dari luar adalah "Process
          # completed with exit code 5", dan menemukan sebabnya
          # menuntut menebak. Sudah terjadi.
          if [ "$kode" != "0" ]; then
            ringkas=$(tail -25 hasil-performa.txt | sed "s/%/%%/g" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Anggaran performa gagal, kode $kode::$ringkas"
          fi
          exit "$kode"
        shell: bash

  bangun:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, keamanan, basisdata, peramban]
    steps:
      - uses: actions/checkout@v4

      - name: Build the folder Cloudflare serves
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: sh tools/bangun_situs.sh

      - name: Every page reached dist/
        run: |
          for berkas in index.html about.html project.html 404.html \
                        robots.txt sitemap.xml feed.xml _headers \
                        assets/js/peta.js assets/css/style.css \
                        blog/index.html; do
            test -f "dist/$berkas" || { echo "missing dist/$berkas"; exit 1; }
          done
          echo "dist/ holds $(find dist -type f | wc -l) files"

      - uses: actions/upload-artifact@v4
        with:
          name: situs
          path: dist
          retention-days: 7
