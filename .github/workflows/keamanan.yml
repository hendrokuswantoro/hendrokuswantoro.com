name: Security Scan, weekly

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    name: OWASP ZAP against a production replica
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: next/package-lock.json

      - name: Build the site and the Next dashboard
        run: |
          sh tools/bangun_situs.sh
          cd next && npm ci --no-audit --no-fund && npm run build

      - name: Attack the replica
        run: sh tools/uji_keamanan.sh "$PWD/hasil-uji-keamanan"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: laporan-zap
          path: hasil-uji-keamanan/*.html
          retention-days: 30
