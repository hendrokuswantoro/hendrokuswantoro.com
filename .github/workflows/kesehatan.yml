# Health Check, the last step of the pipeline in the specification.
#
# It runs against the published site, not against the working copy, because
# what matters is whether a visitor can read the page, not whether the files
# looked right before they were uploaded. Cloudflare does the deploying, so
# this watches from outside rather than pretending to be part of it.
#
# The address lives in a repository variable named SITUS so it can move to
# the real domain without editing this file. Settings, Secrets and variables,
# Actions, Variables tab.

name: Health Check

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  periksa:
    name: Live site
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the address
        id: alamat
        run: |
          situs="${{ vars.SITUS }}"
          if [ -z "$situs" ]; then
            situs="https://hendrokuswantoro-com.kuswantoro-hendro01.workers.dev"
          fi
          echo "situs=$situs" >> "$GITHUB_OUTPUT"
          echo "checking $situs"

      - name: Every page answers
        run: |
          situs="${{ steps.alamat.outputs.situs }}"
          gagal=0
          for jalur in / /about /project /blog/ \n                       /blog/kapan-peta-diam \n                       /blog/titik-panas-bukan-kebakaran \n                       /blog/sumber-di-pojok-peta \n                       /robots.txt /sitemap.xml /feed.xml; do
            kode=$(curl -s -o /dev/null -w '%{http_code}' "$situs$jalur")
            if [ "$kode" != "200" ]; then
              echo "FAIL $jalur -> $kode"
              gagal=1
            else
              echo "ok   $jalur"
            fi
          done
          exit $gagal

      - name: The old .html addresses still lead somewhere
        run: |
          situs="${{ steps.alamat.outputs.situs }}"
          kode=$(curl -s -o /dev/null -w '%{http_code}' "$situs/about.html")
          case "$kode" in
            30*) echo "ok, /about.html redirects with $kode" ;;
            200) echo "ok, /about.html is served directly" ;;
            *) echo "FAIL, /about.html answers $kode"; exit 1 ;;
          esac

      - name: A missing page answers 404, not 200
        run: |
          situs="${{ steps.alamat.outputs.situs }}"
          kode=$(curl -s -o /dev/null -w '%{http_code}' "$situs/tidak-ada-halaman-ini")
          test "$kode" = "404" || { echo "expected 404, got $kode"; exit 1; }
          echo "ok"

      - name: The security headers survived the deploy
        run: |
          situs="${{ steps.alamat.outputs.situs }}"
          kepala=$(curl -sSD - -o /dev/null "$situs/" | tr 'A-Z' 'a-z')
          gagal=0
          for arahan in content-security-policy strict-transport-security \
                        x-content-type-options x-frame-options referrer-policy; do
            if ! printf '%s' "$kepala" | grep -q "$arahan"; then
              echo "FAIL header missing: $arahan"
              gagal=1
            else
              echo "ok   $arahan"
            fi
          done
          exit $gagal

      - name: The feed is well formed
        run: |
          situs="${{ steps.alamat.outputs.situs }}"
          curl -sS "$situs/feed.xml" -o umpan.xml
          python3 -c "import xml.etree.ElementTree as ET; \
            d = ET.parse('umpan.xml'); \
            n = len(d.findall('.//item')); \
            print(n, 'posts in the feed'); \
            raise SystemExit(0 if n >= 3 else 1)"

      - name: The map still asks Mapbox for its tiles
        run: |
          situs="${{ steps.alamat.outputs.situs }}"
          curl -sS "$situs/assets/js/konfigurasi.js" -o konfigurasi.js
          if grep -q 'mapboxToken: ""' konfigurasi.js; then
            echo "the deployed site has no token: the map fell back to OpenFreeMap"
            exit 1
          fi
          grep -q 'mapboxToken: "pk\.' konfigurasi.js
          echo "token present"

      # Bab 15.17 menuntut alerting. Sampai sekarang kegagalan health check
      # hanya duduk di halaman Actions sampai ada yang membukanya, dan
      # pemeriksaan yang tidak pernah dibaca sama saja dengan tidak ada.
      #
      # Satu isu per kejadian, ditutup sendiri begitu situsnya pulih, supaya
      # tidak menumpuk jadi kebisingan yang akhirnya diabaikan juga.
      - name: Open an issue when the site is down
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const judul = "Health check gagal";
            const { data: terbuka } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "kesehatan",
            });
            const jalur = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                          `/actions/runs/${context.runId}`;
            if (terbuka.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: terbuka[0].number,
                body: `Masih gagal pada ${new Date().toISOString()}. ${jalur}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: judul, labels: ["kesehatan"],
                body: [
                  "Situs tidak menjawab sebagaimana mestinya.",
                  jalur,
                  "Langkah mana yang gagal ada di log itu. Isu ini akan " +
                  "ditutup sendiri begitu pemeriksaan berikutnya lolos.",
                ].join("\n\n"),
              });
            }

      - name: Close the issue once the site is healthy again
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: terbuka } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "kesehatan",
            });
            for (const isu of terbuka) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: isu.number,
                body: `Pulih pada ${new Date().toISOString()}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: isu.number, state: "closed",
              });
            }
