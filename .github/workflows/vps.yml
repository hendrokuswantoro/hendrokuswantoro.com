name: Deploy VPS

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vps
  cancel-in-progress: false

jobs:
  kirim:
    name: Build, ship, restart, verify
    runs-on: ubuntu-latest
    if: >-
      vars.VPS_AKTIF == '1' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    env:
      SITUS: ${{ vars.SITUS }}
      ADMIN: ${{ vars.ADMIN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Build the static site
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          test -n "$MAPBOX_TOKEN" || { echo "secret MAPBOX_TOKEN kosong: peta di VPS akan jatuh ke OpenFreeMap"; exit 1; }
          sh tools/bangun_situs.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: next/package-lock.json

      - name: Build the Next dashboard
        working-directory: next
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f out/admin/index.html || { echo "next/out/admin/index.html tidak terbentuk"; exit 1; }

      - name: Load the deploy key
        env:
          KUNCI: ${{ secrets.VPS_SSH_KUNCI }}
          KUNCI_HOST: ${{ secrets.VPS_KUNCI_HOST }}
          HOST: ${{ secrets.VPS_HOST }}
          PORTA: ${{ secrets.VPS_PORTA }}
        run: |
          test -n "$KUNCI" || { echo "VPS_SSH_KUNCI kosong"; exit 1; }
          test -n "$HOST"  || { echo "VPS_HOST kosong"; exit 1; }
          test -n "$KUNCI_HOST" || { echo "VPS_KUNCI_HOST kosong: isi dengan /etc/ssh/ssh_host_ed25519_key.pub milik VPS"; exit 1; }

          mkdir -p ~/.ssh
          printf '%s\n' "$KUNCI" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy

          porta="${PORTA:-22}"
          if [ "$porta" = "22" ]; then nama="$HOST"; else nama="[$HOST]:$porta"; fi
          printf '%s %s\n' "$nama" "$(printf '%s' "$KUNCI_HOST" | cut -d' ' -f1,2)" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n' > ~/.ssh/config

      - name: Ship the site and the code
        env:
          HOST: ${{ secrets.VPS_HOST }}
          AKUN: ${{ secrets.VPS_PENGGUNA }}
          PORTA: ${{ secrets.VPS_PORTA }}
        run: |
          SSH="ssh -i ~/.ssh/deploy -p ${PORTA:-22}"

          rsync -az --delete -e "$SSH" dist/ "$AKUN@$HOST:/srv/hendrokuswantoro/situs/"

          rsync -az --delete -e "$SSH" \
            --exclude '.git' --exclude 'node_modules' --exclude '__pycache__' \
            --exclude 'cadangan' --exclude '.env' --exclude 'dist' --exclude 'next/.next' \
            --exclude '/unggahan' \
            ./ "$AKUN@$HOST:/srv/hendrokuswantoro/app/"

      - name: Install dependencies, migrate, restart
        env:
          HOST: ${{ secrets.VPS_HOST }}
          AKUN: ${{ secrets.VPS_PENGGUNA }}
          PORTA: ${{ secrets.VPS_PORTA }}
        run: |
          ssh -i ~/.ssh/deploy -p "${PORTA:-22}" "$AKUN@$HOST" 'bash -seu' <<'JAUH'
          cd /srv/hendrokuswantoro/app

          /srv/hendrokuswantoro/venv/bin/pip install -q -r backend/requirements.txt

          set -a; . /etc/hendrokuswantoro/env; set +a
          /srv/hendrokuswantoro/venv/bin/python backend/db/migrasi.py

          sudo systemctl restart hk-api
          JAUH

      - name: The API answers after the restart
        env:
          HOST: ${{ secrets.VPS_HOST }}
          AKUN: ${{ secrets.VPS_PENGGUNA }}
          PORTA: ${{ secrets.VPS_PORTA }}
        run: |
          ssh -i ~/.ssh/deploy -p "${PORTA:-22}" "$AKUN@$HOST" 'bash -seu' <<'JAUH'
          for i in $(seq 1 20); do
            if curl -sf --unix-socket /run/hk-api/api.sock http://localhost/health >/dev/null; then
              echo "API menjawab sesudah $i percobaan"
              exit 0
            fi
            sleep 1
          done
          echo "API tidak menjawab dalam 20 detik"
          sudo systemctl status hk-api --no-pager -n 40 || true
          exit 1
          JAUH

      - name: The published site answers
        run: |
          if [ -z "$SITUS" ]; then
            echo "variabel SITUS belum diisi, pemeriksaan luar dilewati"
            exit 0
          fi
          for jalur in / /about /project /blog/; do
            kode=$(curl -s -o /dev/null -w '%{http_code}' "$SITUS$jalur")
            test "$kode" = "200" || { echo "FAIL $jalur -> $kode"; exit 1; }
            echo "ok   $jalur"
          done

      - name: The dashboard answers
        run: |
          if [ -z "$ADMIN" ]; then
            echo "variabel ADMIN belum diisi: situs belum dipindah ke VPS, pemeriksaan dilewati"
            exit 0
          fi
          kode=$(curl -s -o /dev/null -w '%{http_code}' "$ADMIN/admin")
          case "$kode" in
            200) echo "ok, $ADMIN/admin answers 200" ;;
            302) echo "ok, $ADMIN/admin sits behind Cloudflare Access" ;;
            *) echo "FAIL, $ADMIN/admin answers $kode"; exit 1 ;;
          esac

      - name: Say what to do if this failed
        if: failure()
        run: |
          cat <<'PESAN'
          Deploy gagal. Yang ada di server TIDAK otomatis dikembalikan.

          Kode lamanya masih ada di git, jadi pengembaliannya:
            git revert <commit ini>   lalu biarkan alur kerja ini berjalan lagi

          Kalau yang rusak adalah skemanya, cadangan semalam ada di server:
            sudo -u hk /srv/hendrokuswantoro/venv/bin/python \
              backend/db/cadangan.py daftar
          PESAN
