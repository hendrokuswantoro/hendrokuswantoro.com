name: Deploy VPS

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vps
  cancel-in-progress: false

jobs:
  kirim:
    name: Build, ship, restart, verify
    runs-on: ubuntu-latest
    if: >-
      vars.VPS_AKTIF == '1' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build the static site
        run: sh tools/bangun_situs.sh

      - name: Load the deploy key
        env:
          KUNCI: ${{ secrets.VPS_SSH_KUNCI }}
          HOST: ${{ secrets.VPS_HOST }}
          PORTA: ${{ secrets.VPS_PORTA }}
        run: |
          test -n "$KUNCI" || { echo "VPS_SSH_KUNCI kosong"; exit 1; }
          test -n "$HOST"  || { echo "VPS_HOST kosong"; exit 1; }

          mkdir -p ~/.ssh
          printf '%s\n' "$KUNCI" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy

          ssh-keyscan -p "${PORTA:-22}" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship the site and the code
        env:
          HOST: ${{ secrets.VPS_HOST }}
          AKUN: ${{ secrets.VPS_PENGGUNA }}
          PORTA: ${{ secrets.VPS_PORTA }}
        run: |
          SSH="ssh -i ~/.ssh/deploy -p ${PORTA:-22}"

          rsync -az --delete -e "$SSH" dist/ "$AKUN@$HOST:/srv/hendrokuswantoro/situs/"

          rsync -az --delete -e "$SSH" \
            --exclude '.git' --exclude 'node_modules' --exclude '__pycache__' \
            --exclude 'cadangan' --exclude '.env' --exclude 'dist' \
            ./ "$AKUN@$HOST:/srv/hendrokuswantoro/app/"

      - name: Install dependencies, migrate, restart
        env:
          HOST: ${{ secrets.VPS_HOST }}
          AKUN: ${{ secrets.VPS_PENGGUNA }}
          PORTA: ${{ secrets.VPS_PORTA }}
        run: |
          ssh -i ~/.ssh/deploy -p "${PORTA:-22}" "$AKUN@$HOST" 'bash -seu' <<'JAUH'
          cd /srv/hendrokuswantoro/app

          /srv/hendrokuswantoro/venv/bin/pip install -q -r backend/requirements.txt

          set -a; . /etc/hendrokuswantoro/env; set +a
          /srv/hendrokuswantoro/venv/bin/python backend/db/migrasi.py

          sudo systemctl restart hk-api
          JAUH

      - name: The API answers after the restart
        env:
          HOST: ${{ secrets.VPS_HOST }}
          AKUN: ${{ secrets.VPS_PENGGUNA }}
          PORTA: ${{ secrets.VPS_PORTA }}
        run: |
          ssh -i ~/.ssh/deploy -p "${PORTA:-22}" "$AKUN@$HOST" 'bash -seu' <<'JAUH'
          for i in $(seq 1 20); do
            if curl -sf --unix-socket /run/hk-api/api.sock http://localhost/health >/dev/null; then
              echo "API menjawab sesudah $i percobaan"
              exit 0
            fi
            sleep 1
          done
          echo "API tidak menjawab dalam 20 detik"
          sudo systemctl status hk-api --no-pager -n 40 || true
          exit 1
          JAUH

      - name: The published site answers
        run: |
          situs="${{ vars.SITUS }}"
          if [ -z "$situs" ]; then
            echo "variabel SITUS belum diisi, pemeriksaan luar dilewati"
            exit 0
          fi
          for jalur in / /about /project /blog/; do
            kode=$(curl -s -o /dev/null -w '%{http_code}' "$situs$jalur")
            test "$kode" = "200" || { echo "FAIL $jalur -> $kode"; exit 1; }
            echo "ok   $jalur"
          done

      - name: Say what to do if this failed
        if: failure()
        run: |
          cat <<'PESAN'
          Deploy gagal. Yang ada di server TIDAK otomatis dikembalikan.

          Kode lamanya masih ada di git, jadi pengembaliannya:
            git revert <commit ini>   lalu biarkan alur kerja ini berjalan lagi

          Kalau yang rusak adalah skemanya, cadangan semalam ada di server:
            sudo -u hk /srv/hendrokuswantoro/venv/bin/python \
              backend/db/cadangan.py daftar
          PESAN
